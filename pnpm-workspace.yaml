allowBuilds:
  # Native (napi-rs) module resolver pulled by jest-resolve@30. Trusted.
  unrs-resolver: true
  # Optional native watcher pulled by jest-haste-map@30.5; jest falls back to its
  # own inline watcher, so the postinstall is not needed and is explicitly
  # declined.
  '@parcel/watcher': false

# Newly published release used by this dependency pass. The supply-chain policy
# rejects versions younger than 24 h; drop this entry once the release has aged
# past the cutoff.
minimumReleaseAgeExclude:
  - '@fastify/static@10.1.10'

# Advisories that a declared floor cannot reach because the vulnerable line is
# admitted by a third-party parent's own range. Kept until the next major
# dependency refresh makes them redundant.
overrides:
  brace-expansion: ^5.0.12
  engine.io: ^6.6.10
  fast-uri: ^3.1.9
  form-data: ^4.0.6
  socket.io-parser: ^4.2.7
  ws: ^8.21.0
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  glob: ^14.0.2
  qs: ^6.16.1
  js-yaml: ^3.15.2
  minimatch: ^11.0.1
  markdown-it: ^14.3.3
  # @fastify/static 10 depends on content-disposition 3.x, which is ESM-only,
  # while this package emits CommonJS and is exercised through Jest's
  # require() path. 2.0.1 exposes the same CommonJS `create()` API and has no
  # open advisory. Remove once @fastify/static can be consumed from CommonJS
  # with the 3.x release.
  content-disposition: ^2.0.1
